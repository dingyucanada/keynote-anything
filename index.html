<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta
      name="description"
      content="让任何事物，都拥有自己的发布会。Turn an ordinary thing into an extraordinary keynote. Create, edit, present and export — no account needed."
    />
    <meta property="og:title" content="Keynote Anything · 万物发布会" />

      content="https://dingyucanada.github.io/keynote-anything/docs/studio.png"

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

      >请启用 JavaScript 使用创作工作台。Enable JavaScript to use the
